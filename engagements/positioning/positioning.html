<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positioning</title>
    <link rel="stylesheet" href="positioning.css">
</head>
<body>
    <header>
        <h1>boys web design site</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <h1>Positioning</h1>
        <figure id="floatfig" class="pipelinefig"><img src="images/pipeline.jpg" alt="man surfing a big wave"><figcaption>Man surfing a big wave</figcaption></figure>
        <p>normal flow in html is left to right, top to bottom</p>
        <p>the float thing will move the image to the right of the text in its family</p>
        <p>mobile navigation buttons can be made using these techniques</p>
        <div class="enforcer"></div>
        <figure id="relative" class="pipelinefig"><img src="images/pipeline.jpg" alt="man surfing a big wave"><figcaption>relative will move the image relative to its normal position</figcaption></figure>
        <figure id="absolute" class="pipelinefig"><img src="images/pipeline.jpg" alt="man surfing a big wave"><figcaption>absolute will move the image relative to its nearest positioned ancestor</figcaption></figure>
        <figure id="fixed" class="pipelinefig"><img src="images/pipeline.jpg" alt="man surfing a big wave"><figcaption>fixed will move the image relative to the viewport</figcaption></figure>
        <div class="enforcer"></div>
    </main>
    <footer>
        <p>&copy; 2026 boy</p>
    </footer>
</body>
</html>
