<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header>
        <h1>Sign Up</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
    <main>
        <form action="formprocessing.html" method="get" id="signupform">
            <fieldset>
                <legend>Account</legend>
            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email Address">
            </div>
            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password">
            </div>
            </fieldset>
            <fieldset>
                <legend>About You</legend>
                <div class="form-row">
                    <label for="personname">Name:</label>
                    <input type="text" id="personname" name="fullname" placeholder="Full Name">
                </div>
                <div class="form-row">
                    <label for="age">Date of Birth:</label>
                    <input type="date" id="age" name="age">
                </div>
                <div class="form-row">
                    <label for="state">State:</label>
                    <select id="state" name="state">
                        <option value="">------</option>
                        <option value="AK">Alaska</option>
                        <option value="HI">Hawaii</option>
                        <option value="UT">Utah</option>
                        <option value="TX">Texas</option>
                    </select>
                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <label for="robotcheck">Remember Me?</label>
                    <input type="checkbox" value="Yes" id="robotcheck" name="robotcheck" >
                </div>
                <div class="check-row">
                    <div class="spacer"></div>
                    <fieldset>
                        <legend>Gender</legend>
                        <input type="radio" id="radio1" name="radio" value="Male">
                        <label for="radio1">Male</label>
                        <input type="radio" id="radio2" name="radio" value="Female">
                        <label for="radio2">Female</label>
                    </fieldset>
                </div>
                <div class="form-row">
                    <label for="aboutperson">Comments:</label>
                    <textarea id="aboutperson" name="aboutperson"></textarea>
                </div>
                <input type="submit" value="Submit">
            </fieldset>
        </form>
        <p id="message"></p>
    </main>
    <footer>
        <p>&copy; 2026 Boydat</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
